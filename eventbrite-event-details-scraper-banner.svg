    Eventbrite Event Details Scraper
  </text>

  <!-- Subtitle -->
  <text x="800" y="155" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.85)" text-anchor="middle" font-weight="400" filter="url(#shadow)">
    Turn any Eventbrite event URL or ID into rich, structured data — no API key needed
  </text>

  <!-- Horizontal accent line -->
  <line x1="600" y1="180" x2="1000" y2="180" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>

  <!-- Features - two rows of readable text -->
  
  <!-- Row 1 -->
  <text x="400" y="230" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="600" filter="url(#shadow)">
    Zero Setup
  </text>
  <text x="400" y="252" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.75)" text-anchor="middle" font-weight="400">
    No API key, OAuth, or login required
  </text>

  <text x="800" y="230" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="600" filter="url(#shadow)">
