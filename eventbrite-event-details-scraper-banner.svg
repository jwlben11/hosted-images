  </text>
  <text x="800" y="252" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.75)" text-anchor="middle" font-weight="400">
    Organizer stats, galleries, discounts, refund policies
  </text>

  <text x="1200" y="230" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="600" filter="url(#shadow)">
    Ticket Intelligence
  </text>
  <text x="1200" y="252" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.75)" text-anchor="middle" font-weight="400">
    Pricing, availability, sold-out detection, urgency
  </text>

  <!-- Row 2 -->
  <text x="400" y="310" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="600" filter="url(#shadow)">
    Batch Mode
  </text>
  <text x="400" y="332" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.75)" text-anchor="middle" font-weight="400">
    Up to 50 events per request in fast mode
  </text>

  <text x="800" y="310" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="600" filter="url(#shadow)">
    Organizer &amp; Venue Data
  </text>
  <text x="800" y="332" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.75)" text-anchor="middle" font-weight="400">
    Profiles, addresses, GPS, online event detection
  </text>

  <text x="1200" y="310" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="600" filter="url(#shadow)">
    Global Coverage
  </text>
  <text x="1200" y="332" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.75)" text-anchor="middle" font-weight="400">
    Works with any public Eventbrite event worldwide
  </text>

  <!-- Footer -->
