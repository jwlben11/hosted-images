<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E32F28"/>
      <stop offset="100%" style="stop-color:#C42721"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="btn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F0F0F0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="480" fill="url(#bg)"/>

  <!-- Subtle diagonal pattern overlay -->
  <g opacity="0.04">
    <line x1="0" y1="0" x2="400" y2="480" stroke="#FFF" stroke-width="2"/>
    <line x1="200" y1="0" x2="600" y2="480" stroke="#FFF" stroke-width="2"/>
    <line x1="400" y1="0" x2="800" y2="480" stroke="#FFF" stroke-width="2"/>
    <line x1="600" y1="0" x2="1000" y2="480" stroke="#FFF" stroke-width="2"/>
    <line x1="800" y1="0" x2="1200" y2="480" stroke="#FFF" stroke-width="2"/>
    <line x1="1000" y1="0" x2="1400" y2="480" stroke="#FFF" stroke-width="2"/>
    <line x1="1200" y1="0" x2="1600" y2="480" stroke="#FFF" stroke-width="2"/>
    <line x1="1400" y1="0" x2="1600" y2="320" stroke="#FFF" stroke-width="2"/>
  </g>

  <!-- Accent bar top -->
  <rect x="0" y="0" width="1600" height="6" fill="#FFFFFF" opacity="0.2"/>

  <!-- Decorative elements -->
  <circle cx="1350" cy="120" r="280" fill="url(#accent)"/>
  <circle cx="1400" cy="400" r="200" fill="url(#accent)"/>
  <circle cx="200" cy="450" r="180" fill="url(#accent)"/>

  <!-- Bus icon abstraction (bottom-left) -->
  <g transform="translate(90, 320)" opacity="0.10">
    <rect x="0" y="30" width="140" height="80" rx="12" fill="#FFF"/>
    <rect x="12" y="18" width="116" height="24" rx="8" fill="#FFF"/>
    <circle cx="35" cy="120" r="16" fill="#FFF"/>
    <circle cx="105" cy="120" r="16" fill="#FFF"/>
    <line x1="20" y1="50" x2="28" y2="50" stroke="#FFF" stroke-width="3" opacity="0.4"/>
    <line x1="20" y1="60" x2="28" y2="60" stroke="#FFF" stroke-width="3" opacity="0.4"/>
    <line x1="20" y1="70" x2="28" y2="70" stroke="#FFF" stroke-width="3" opacity="0.4"/>
    <line x1="56" y1="50" x2="64" y2="50" stroke="#FFF" stroke-width="3" opacity="0.4"/>
    <line x1="56" y1="60" x2="64" y2="60" stroke="#FFF" stroke-width="3" opacity="0.4"/>
    <line x1="56" y1="70" x2="64" y2="70" stroke="#FFF" stroke-width="3" opacity="0.4"/>
  </g>

  <!-- Map pin icon -->
  <g transform="translate(1310, 85)" opacity="0.08">
    <path d="M0 0 C0 45 35 80 35 80 C35 80 70 45 70 0 C70 -18 55 -30 35 -30 C15 -30 0 -18 0 0Z" fill="#FFF"/>
    <circle cx="35" cy="0" r="12" fill="#E32F28"/>
  </g>

  <!-- Main headline -->
  <text x="160" y="155" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="64" font-weight="700" fill="#FFFFFF" letter-spacing="-1">
    Itabus Scraper
  </text>

  <!-- Subtitle -->
  <text x="160" y="210" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#FFFFFF" opacity="0.9" letter-spacing="0.5">
    Scrape the complete Itabus bus network
  </text>

  <!-- Divider line -->
  <line x1="160" y1="238" x2="460" y2="238" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Bullet points -->
  <g transform="translate(160, 270)">
    <rect x="0" y="2" width="12" height="12" rx="3" fill="#FFFFFF" opacity="0.6"/>
    <text x="26" y="14" font-family="'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#FFFFFF" opacity="0.88">
      1,378+ stations across Italy &amp; Europe
    </text>

    <rect x="0" y="42" width="12" height="12" rx="3" fill="#FFFFFF" opacity="0.6"/>
    <text x="26" y="54" font-family="'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#FFFFFF" opacity="0.88">
      Price calendars, journey search &amp; seat availability
    </text>

    <rect x="0" y="82" width="12" height="12" rx="3" fill="#FFFFFF" opacity="0.6"/>
    <text x="26" y="94" font-family="'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#FFFFFF" opacity="0.88">
      No login or API key required — free to use
    </text>
  </g>

  <!-- Apify badge -->
  <text x="1480" y="460" font-family="'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#FFFFFF" opacity="0.35" text-anchor="end">
    Apify Actor
  </text>
</svg>
