<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E32F28"/>
      <stop offset="100%" style="stop-color:#C42721"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="btn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F0F0F0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="480" fill="url(#bg)"/>

  <!-- Subtle diagonal pattern overlay -->
  <g opacity="0.04">
    <line x1="0" y1="0" x2="400" y2="480" stroke="#FFF" stroke-width="2"/>
    <line x1="200" y1="0" x2="600" y2="480" stroke="#FFF" stroke-width="2"/>
    <line x1="400" y1="0" x2="800" y2="480" stroke="#FFF" stroke-width="2"/>
    <line x1="600" y1="0" x2="1000" y2="480" stroke="#FFF" stroke-width="2"/>
    <line x1="800" y1="0" x2="1200" y2="480" stroke="#FFF" stroke-width="2"/>
    <line x1="1000" y1="0" x2="1400" y2="480" stroke="#FFF" stroke-width="2"/>
    <line x1="1200" y1="0" x2="1600" y2="480" stroke="#FFF" stroke-width="2"/>
    <line x1="1400" y1="0" x2="1600" y2="320" stroke="#FFF" stroke-width="2"/>
  </g>

  <!-- Accent bar top -->
  <rect x="0" y="0" width="1600" height="6" fill="#FFFFFF" opacity="0.2"/>

  <!-- Decorative circle -->
  <circle cx="1350" cy="120" r="280" fill="url(#accent)"/>
  <circle cx="1400" cy="400" r="200" fill="url(#accent)"/>
  <circle cx="200" cy="450" r="180" fill="url(#accent)"/>

  <!-- Bus icon abstraction -->
  <g transform="translate(110, 120)" opacity="0.1">
    <rect x="0" y="30" width="120" height="70" rx="10" fill="#FFF"/>
    <rect x="10" y="20" width="100" height="20" rx="6" fill="#FFF"/>
    <circle cx="30" cy="110" r="14" fill="#FFF"/>
    <circle cx="90" cy="110" r="14" fill="#FFF"/>
  </g>

  <!-- Map pin icon abstraction -->
  <g transform="translate(1350, 100)" opacity="0.08">
    <path d="M0 0 C0 40 30 70 30 70 C30 70 60 40 60 0 C60 -15 50 -25 30 -25 C10 -25 0 -15 0 0Z" fill="#FFF"/>
    <circle cx="30" cy="0" r="10" fill="#E32F28"/>
  </g>

  <!-- Main headline -->
  <text x="120" y="175" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="72" font-weight="700" fill="#FFFFFF" letter-spacing="-1.5">
    Itabus Scraper
  </text>

  <!-- Subtitle -->
  <text x="120" y="235" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="400" fill="#FFFFFF" opacity="0.9" letter-spacing="0.3">
    Scrape the complete Itabus bus network
  </text>

  <!-- Bullet points -->
  <g transform="translate(120, 290)">
    <circle cx="0" cy="-6" r="4" fill="#FFF" opacity="0.7"/>
    <text x="18" y="4" font-family="'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#FFFFFF" opacity="0.85">
      1,378+ stations across Italy &amp; Europe
    </text>

    <circle cx="0" cy="34" r="4" fill="#FFF" opacity="0.7"/>
    <text x="18" y="44" font-family="'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#FFFFFF" opacity="0.85">
      Price calendars, journey search &amp; seat availability
    </text>

    <circle cx="0" cy="74" r="4" fill="#FFF" opacity="0.7"/>
    <text x="18" y="84" font-family="'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#FFFFFF" opacity="0.85">
      No login or API key required — free to use
    </text>
  </g>

  <!-- CTA button -->
  <rect x="120" y="400" width="220" height="52" rx="26" fill="url(#btn)"/>
  <text x="230" y="432" font-family="'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#E32F28" text-anchor="middle">
    Try on Apify Store →
  </text>

  <!-- Apify badge -->
  <text x="1480" y="460" font-family="'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#FFFFFF" opacity="0.4" text-anchor="end">
    Apify Actor
  </text>
</svg>
