<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#069026;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#04b02e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0faf3;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="400" fill="url(#grad)"/>

  <!-- Subtle decorative circles -->
  <circle cx="1400" cy="50" r="200" fill="#ffffff" opacity="0.04"/>
  <circle cx="200" cy="380" r="150" fill="#ffffff" opacity="0.04"/>
  <circle cx="800" cy="200" r="250" fill="#ffffff" opacity="0.03"/>

  <!-- Left section: Title -->
  <text x="80" y="130" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="-0.5">NaukriGulf Jobs Scraper</text>
  <text x="80" y="175" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#ffffff" opacity="0.9">Scrape Gulf job listings — full details, no login, low cost</text>

  <!-- Stats row -->
  <g transform="translate(80, 220)">
    <rect x="0" y="0" width="120" height="36" rx="18" fill="#ffffff" opacity="0.15"/>
    <text x="60" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">10K results</text>

    <rect x="134" y="0" width="120" height="36" rx="18" fill="#ffffff" opacity="0.15"/>
    <text x="194" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">$0.80 / 1K</text>

    <rect x="268" y="0" width="130" height="36" rx="18" fill="#ffffff" opacity="0.15"/>
    <text x="333" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">29 fields each</text>
  </g>

  <!-- CTA button -->
  <g transform="translate(80, 290)">
    <rect x="0" y="0" width="200" height="50" rx="25" fill="#ffffff" filter="url(#shadow)"/>
    <text x="100" y="31" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#069026" text-anchor="middle">▶ Run on Apify</text>
  </g>

  <!-- Right section: Job card preview -->
  <g transform="translate(780, 60)" filter="url(#shadow)">
    <rect x="0" y="0" width="740" height="280" rx="12" fill="url(#cardGrad)"/>

    <!-- Card header -->
    <rect x="0" y="0" width="740" height="50" rx="12" fill="#ffffff"/>
    <rect x="0" y="30" width="740" height="20" fill="#ffffff"/>
    <text x="30" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#333333">Job Listing Sample</text>
    <text x="690" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#999999" text-anchor="end">29 fields extracted</text>

    <!-- Title -->
    <text x="30" y="88" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1a1a1a">Python Developer</text>

    <!-- Company + Location row -->
    <circle cx="34" cy="114" r="4" fill="#069026" opacity="0.6"/>
    <text x="48" y="119" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#555555">TASC Outsourcing — Abu Dhabi, United Arab Emirates</text>

    <!-- Tags row -->
    <rect x="30" y="136" width="90" height="24" rx="12" fill="#069026" opacity="0.1"/>
    <text x="75" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#069026" text-anchor="middle">8-9 yrs exp</text>

    <rect x="130" y="136" width="80" height="24" rx="12" fill="#069026" opacity="0.1"/>
    <text x="170" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#069026" text-anchor="middle">Full-time</text>

    <rect x="220" y="136" width="130" height="24" rx="12" fill="#069026" opacity="0.1"/>
    <text x="285" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#069026" text-anchor="middle">Posted 2 days ago</text>

    <!-- Table: extra fields -->
    <line x1="30" y1="176" x2="710" y2="176" stroke="#e0e0e0" stroke-width="1"/>

    <text x="30" y="198" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#999999">INDUSTRY TYPE</text>
    <text x="200" y="198" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#999999">FUNCTIONAL AREA</text>
    <text x="400" y="198" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#999999">COMPANY TYPE</text>

    <text x="30" y="218" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#333333">Other</text>
    <text x="200" y="218" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#333333">IT Software</text>
    <text x="400" y="218" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#333333">Consultant</text>

    <!-- Footer badges -->
    <rect x="30" y="240" width="90" height="22" rx="11" fill="#fff3e0"/>
    <text x="75" y="255" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#e65100" text-anchor="middle">Top Employer</text>

    <rect x="130" y="240" width="80" height="22" rx="11" fill="#e3f2fd"/>
    <text x="170" y="255" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#1565c0" text-anchor="middle">Easy Apply</text>

    <rect x="220" y="240" width="90" height="22" rx="11" fill="#fce4ec"/>
    <text x="265" y="255" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#c62828" text-anchor="middle">Sponsored</text>
  </g>

  <!-- Country flags bar at bottom -->
  <rect x="0" y="370" width="1600" height="30" fill="#000000" opacity="0.08"/>
  <text x="800" y="390" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffffff" fill-opacity="0.8" text-anchor="middle">🇦🇪 UAE  ·  🇸🇦 Saudi Arabia  ·  🇶🇦 Qatar  ·  🇰🇼 Kuwait  ·  🇴🇲 Oman  ·  🇧🇭 Bahrain  ·  🇪🇬 Egypt</text>
</svg>
